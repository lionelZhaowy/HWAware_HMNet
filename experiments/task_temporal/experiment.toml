dataset = "peod"
modality = "rgbdvs"
representation = "polarity_binary"

# RecipeV2：先用 RGB A0/A1 筛选；修复数值契约并维护 EMA，从官方 B1 初始化。
epochs = 60
batch = 8
eval_batch = 8
workers = 2
learning_rate = 0.0005
accumulation = 4
seed = 42
precision = "bf16"
min_learning_rate = 0.000005
warmup_epochs = 5.0
warmup_start_factor = 0.1
weight_decay = 0.01
prefetch_factor = 1
eval_every_epochs = 1
